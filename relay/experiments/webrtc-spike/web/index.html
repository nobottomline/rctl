<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rctl · WebRTC DataChannel spike</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0e0f13; color: #d6d8de; padding: 28px; }
  h1 { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  .muted { color: #8a8f9a; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; max-width: 720px; margin-top: 18px; }
  .card { background: #16181f; border: 1px solid #23262f; border-radius: 12px; padding: 14px 16px; }
  .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #777c87; }
  .v { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .v small { font-size: 13px; color: #8a8f9a; font-weight: 400; }
  #state { padding: 3px 9px; border-radius: 999px; background: #23262f; font-size: 12px; }
  .ok { color: #5fd08a; } .warn { color: #e2b84f; } .bad { color: #e2685f; }
  button { background: #c25e3a; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px;
           font: inherit; cursor: pointer; margin-top: 16px; }
  canvas { margin-top: 16px; border-radius: 10px; border: 1px solid #23262f; background: #0a0b0e; display:block; }
</style>
</head>
<body>
  <h1>rctl · WebRTC DataChannel spike <span id="state">idle</span></h1>
  <p class="muted">Browser ⇆ native (libdatachannel) over an unreliable, unordered <code>video</code> channel.
     One-way latency uses the shared wall clock (same machine).</p>

  <div class="grid">
    <div class="card"><div class="k">latency (one-way)</div><div class="v"><span id="lat">—</span> <small>ms</small></div></div>
    <div class="card"><div class="k">latency p95 / max</div><div class="v"><span id="latp">—</span> <small>ms</small></div></div>
    <div class="card"><div class="k">fps received</div><div class="v"><span id="fps">—</span></div></div>
    <div class="card"><div class="k">frames · out-of-order · gaps</div><div class="v" style="font-size:20px"><span id="frames">0</span> · <span id="ooo">0</span> · <span id="gaps">0</span></div></div>
  </div>

  <canvas id="plot" width="720" height="120"></canvas>
  <button id="ping">send control ping</button>

  <script type="module">
  const $ = (id) => document.getElementById(id)
  const setState = (t, cls) => { $('state').textContent = t; $('state').className = cls || '' }

  const ws = new WebSocket(`ws://${location.host}/ws?role=browser`)
  const pc = new RTCPeerConnection({}) // localhost: no ICE servers
  window.pc = pc; window.remoteCands = []
  let controlCh = null

  pc.onicecandidate = (e) => { if (e.candidate) ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate.candidate, mid: e.candidate.sdpMid })) }
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState
    setState(s, s === 'connected' ? 'ok' : s === 'failed' ? 'bad' : 'warn')
  }

  // Browser is the offerer: it creates the channels (so their reliability is set
  // here) and offers once it's connected — the native peer is already waiting.
  let videoCh = null
  ws.onopen = () => {
    setState('signaling', 'warn')
    videoCh = pc.createDataChannel('video', { ordered: false, maxRetransmits: 0 })
    videoCh.binaryType = 'arraybuffer'
    videoCh.onmessage = onVideo
    controlCh = pc.createDataChannel('control')
    pc.createOffer()
      .then((o) => pc.setLocalDescription(o))
      .then(() => ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp })))
  }
  let remoteReady = false
  const pendingCands = []
  ws.onmessage = async (ev) => {
    const m = JSON.parse(ev.data)
    if (m.type === 'answer') {
      await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp })
      remoteReady = true
      for (const ic of pendingCands.splice(0)) { try { await pc.addIceCandidate(ic) } catch (e) { console.error('flush', e) } }
    } else if (m.type === 'candidate') {
      // libdatachannel sends "a=candidate:…"; queue until the answer is applied.
      const ic = { candidate: m.candidate.replace(/^a=/, ''), sdpMid: m.mid || '0' }
      window.remoteCands.push(ic.candidate)
      if (remoteReady) { try { await pc.addIceCandidate(ic) } catch (e) { console.error('addIce', e) } }
      else pendingCands.push(ic)
    }
  }

  // ---- stats ----
  let frames = 0, ooo = 0, gaps = 0, lastSeq = -1, fpsCount = 0
  const lats = []
  function onVideo(m) {
    const dv = new DataView(m.data)
    const seq = dv.getUint32(0, true)
    const sendMs = Number(dv.getBigInt64(4, true))
    const lat = Date.now() - sendMs
    frames++; fpsCount++
    if (lastSeq >= 0) {
      if (seq < lastSeq) ooo++
      else if (seq > lastSeq + 1) gaps += seq - lastSeq - 1
    }
    lastSeq = Math.max(lastSeq, seq)
    lats.push(lat); if (lats.length > 300) lats.shift()
    $('lat').textContent = lat
    $('frames').textContent = frames; $('ooo').textContent = ooo; $('gaps').textContent = gaps
  }

  // 1s aggregates + plot
  const ctx = $('plot').getContext('2d')
  setInterval(() => {
    $('fps').textContent = fpsCount; fpsCount = 0
    if (lats.length) {
      const sorted = [...lats].sort((a, b) => a - b)
      $('latp').textContent = `${sorted[Math.floor(sorted.length * 0.95)]} / ${sorted[sorted.length - 1]}`
    }
    // plot last 300 latencies
    ctx.clearRect(0, 0, 720, 120)
    ctx.strokeStyle = '#c25e3a'; ctx.beginPath()
    const maxL = Math.max(50, ...lats)
    lats.forEach((l, i) => {
      const x = (i / 300) * 720, y = 120 - (l / maxL) * 116
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
    })
    ctx.stroke()
  }, 1000)

  $('ping').onclick = () => controlCh && controlCh.readyState === 'open' && controlCh.send('ping ' + Date.now())
  </script>
</body>
</html>

<!doctype html>
<!-- rctl web client. Served from /var/mobile/rctl/index.html on the device
     (falls back to the copy embedded in HttpStreamServer.mm). -->
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>rctl</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#ddd;
    font-family:-apple-system,system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{transform-origin:center center}
  #hud{position:fixed;top:6px;left:8px;font-size:11px;opacity:.5;z-index:10;pointer-events:none}
  /* Floating controls: a small button that opens a popover, so the screen is
     unobstructed while viewing. */
  #fab{position:fixed;right:13px;bottom:13px;z-index:20;width:42px;height:42px;
    border-radius:50%;border:0;background:rgba(22,22,24,.55);color:#f2f2f7;font-size:18px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 2px 10px rgba(0,0,0,.4);transition:background .12s}
  #fab:active,#fab.open{background:#3478f6}
  #panel{position:fixed;right:13px;bottom:62px;z-index:20;width:196px;box-sizing:border-box;
    background:rgba(28,28,31,.72);border-radius:14px;padding:8px;
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    box-shadow:0 6px 22px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:5px;
    opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .13s,transform .13s}
  #panel.open{opacity:1;transform:none;pointer-events:auto}
  .sect{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#7d7d82;margin:3px 2px -2px}
  .row{display:flex;gap:5px}
  #panel button{flex:1;min-width:0;background:#3a3a3d;color:#f2f2f7;border:0;border-radius:8px;
    padding:7px 4px;font-size:12px;white-space:nowrap}
  #panel button:active{background:#3478f6}
  #panel button.on{background:#3478f6}
</style></head>
<body>
<div id="hud">rctl: connecting…</div>
<div id="stage"><canvas id="c"></canvas></div>

<button id="fab" aria-label="controls">⚙</button>
<div id="panel">
  <div class="sect">System</div>
  <div class="row">
    <button data-b="home">⌂ Home</button>
    <button data-b="lock">⏻ Lock</button>
  </div>
  <div class="row">
    <button data-sb="1">Control&nbsp;Center</button>
    <button data-sb="2">Shade</button>
  </div>
  <div class="sect">Volume</div>
  <div class="row">
    <button data-b="voldn">Vol&nbsp;−</button>
    <button data-b="volup">Vol&nbsp;+</button>
  </div>
  <div class="sect">Orientation</div>
  <div class="row">
    <button id="oAuto" class="on">Auto</button>
    <button id="oRot">⟳ Rotate</button>
  </div>
  <div class="sect">Quality</div>
  <div class="row">
    <button data-q="hq" class="on">High</button>
    <button data-q="bal">Balanced</button>
    <button data-q="lat">Low&nbsp;latency</button>
  </div>
</div>

<script>
const hud=document.getElementById('hud'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let dec=null,ts=0,frames=0,started=false,orient=1,codec='avc1.640033';
// Manual orientation override (null = follow the device). Applies to BOTH the
// displayed rotation and the input coordinate mapping, so they stay consistent.
let manualOrient=null;
function effOrient(){ return manualOrient!=null?manualOrient:orient; }
// UIInterfaceOrientation -> CSS rotation (deg) to make content upright.
const DEG={1:0,2:180,3:-90,4:90};
function applyOrient(){
  const deg=DEG[effOrient()]||0,cw=canvas.width||1,ch=canvas.height||1;
  const r90=(deg===90||deg===-90);
  const bbW=r90?ch:cw,bbH=r90?cw:ch;
  const sc=Math.min(innerWidth/bbW,innerHeight/bbH);
  canvas.style.transform=`rotate(${deg}deg) scale(${sc})`;
}
addEventListener('resize',applyOrient);
// Derive the WebCodecs codec string from an Annex-B SPS NAL (type 7).
function codecFromAU(au){
  for(let i=0;i+8<au.length;i++){
    if(au[i]===0&&au[i+1]===0&&au[i+2]===0&&au[i+3]===1&&(au[i+4]&0x1f)===7){
      return 'avc1.'+[au[i+5],au[i+6],au[i+7]].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }
  return null;
}
function mkdec(){
  if(dec){try{dec.close()}catch(e){}}
  dec=new VideoDecoder({
    output:f=>{const rs=(canvas.width!==f.displayWidth||canvas.height!==f.displayHeight);
      if(rs){canvas.width=f.displayWidth;canvas.height=f.displayHeight;}
      ctx.drawImage(f,0,0);f.close();frames++;if(rs)applyOrient();},
    error:e=>{hud.textContent='decoder error: '+e.message;started=false;dec=null;}
  });
  dec.configure({codec,optimizeForLatency:true});
}
setInterval(()=>{hud.textContent=`rctl — ${frames}f ${canvas.width}x${canvas.height} o=${effOrient()}${manualOrient!=null?'*':''}`;},1000);

// ---- floating control panel ----
const fab=document.getElementById('fab'),panel=document.getElementById('panel');
function setPanel(open){ panel.classList.toggle('open',open); fab.classList.toggle('open',open); }
fab.onclick=e=>{ e.stopPropagation(); setPanel(!panel.classList.contains('open')); };

// Quality presets
document.querySelectorAll('#panel button[data-q]').forEach(b=>b.onclick=()=>{
  const q={hq:'scale=1.0&fps=30&bitrate=24000000',
           bal:'scale=0.75&fps=45&bitrate=14000000',
           lat:'scale=0.6&fps=60&bitrate=8000000'}[b.dataset.q];
  fetch('/config?'+q);
  document.querySelectorAll('#panel button[data-q]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
});
// Orientation override: Auto follows the device; Rotate steps the view 90° CW.
const oAuto=document.getElementById('oAuto'),oRot=document.getElementById('oRot');
const ROT=[1,4,2,3]; // DEG steps 0,90,180,270
function setOrientUI(){ oAuto.classList.toggle('on',manualOrient==null); }
oAuto.onclick=()=>{ manualOrient=null; setOrientUI(); applyOrient(); };
oRot.onclick=()=>{ let i=ROT.indexOf(effOrient()); if(i<0)i=0; manualOrient=ROT[(i+1)%4]; setOrientUI(); applyOrient(); };

// ---- input: map a click on the displayed (rotated/scaled) canvas back to
// normalized framebuffer coordinates (the screen's FIXED space), send to device ----
function clientToNorm(cx,cy){
  const deg=DEG[effOrient()]||0, rad=-deg*Math.PI/180;
  const cw=canvas.width||1, ch=canvas.height||1, r90=(deg===90||deg===-90);
  const bbW=r90?ch:cw, bbH=r90?cw:ch;
  const sc=Math.min(innerWidth/bbW, innerHeight/bbH);
  let dx=(cx-innerWidth/2)/sc, dy=(cy-innerHeight/2)/sc;
  const rx=dx*Math.cos(rad)-dy*Math.sin(rad), ry=dx*Math.sin(rad)+dy*Math.cos(rad);
  return [(rx+cw/2)/cw, (ry+ch/2)/ch];
}
function send(p,nx,ny){ fetch(`/input?phase=${p}&id=0&x=${nx.toFixed(4)}&y=${ny.toFixed(4)}`).catch(()=>{}); }
const stage=document.getElementById('stage');
stage.style.touchAction='none';
let down=false,lastMove=0;
stage.addEventListener('pointerdown',e=>{
  if(panel.classList.contains('open')){ setPanel(false); e.preventDefault(); return; } // tap-away closes panel
  down=true;try{stage.setPointerCapture(e.pointerId)}catch(_){}
  const[x,y]=clientToNorm(e.clientX,e.clientY);send(0,x,y);e.preventDefault();});
stage.addEventListener('pointermove',e=>{if(!down)return;const now=performance.now();if(now-lastMove<16)return;lastMove=now;
  const[x,y]=clientToNorm(e.clientX,e.clientY);send(1,x,y);e.preventDefault();});
function up(e){if(!down)return;down=false;const[x,y]=clientToNorm(e.clientX,e.clientY);send(2,x,y);e.preventDefault();}
stage.addEventListener('pointerup',up);
stage.addEventListener('pointercancel',up);
// ---- keyboard: forward physical keystrokes as HID key events ----
function codeToUsage(c){
  if(/^Key[A-Z]$/.test(c)) return 0x04+(c.charCodeAt(3)-65);
  if(/^Digit[1-9]$/.test(c)) return 0x1E+(c.charCodeAt(5)-49);
  if(c==='Digit0') return 0x27;
  return ({Enter:0x28,NumpadEnter:0x28,Escape:0x29,Backspace:0x2A,Tab:0x2B,Space:0x2C,
    Minus:0x2D,Equal:0x2E,BracketLeft:0x2F,BracketRight:0x30,Backslash:0x31,
    Semicolon:0x33,Quote:0x34,Backquote:0x35,Comma:0x36,Period:0x37,Slash:0x38,CapsLock:0x39,
    ArrowRight:0x4F,ArrowLeft:0x50,ArrowDown:0x51,ArrowUp:0x52,
    Delete:0x4C,Home:0x4A,End:0x4D,PageUp:0x4B,PageDown:0x4E,
    ControlLeft:0xE0,ShiftLeft:0xE1,AltLeft:0xE2,MetaLeft:0xE3,
    ControlRight:0xE4,ShiftRight:0xE5,AltRight:0xE6,MetaRight:0xE7})[c]||0;
}
function key(u,d){ fetch(`/key?p=7&u=${u}&d=${d}`).catch(()=>{}); }
// Modifiers held (press/release); regular keys as one atomic tap (d=2) so a
// lost/late release can't make iOS auto-repeat ("ls -la" -> "ls -laa").
const MODS=new Set([0xE0,0xE1,0xE2,0xE3,0xE4,0xE5,0xE6,0xE7]);
addEventListener('keydown',e=>{const u=codeToUsage(e.code);if(!u)return;e.preventDefault();
  if(MODS.has(u)){if(!e.repeat)key(u,1);}else{key(u,2);}});
addEventListener('keyup',e=>{const u=codeToUsage(e.code);if(!u)return;e.preventDefault();
  if(MODS.has(u))key(u,0);});
// ---- hardware buttons (HID Consumer page 0x0C) + SpringBoard actions ----
const SYS={home:0x40,lock:0x30,volup:0xE9,voldn:0xEA};
function sysPress(name){const u=SYS[name];if(!u)return;
  fetch(`/key?p=12&u=${u}&d=1`).then(()=>setTimeout(()=>fetch(`/key?p=12&u=${u}&d=0`),70));}
document.querySelectorAll('#panel button[data-b]').forEach(b=>b.onclick=()=>sysPress(b.dataset.b));
// page 0xF0=240: 1=Control Center, 2=Cover Sheet.
document.querySelectorAll('#panel button[data-sb]').forEach(b=>b.onclick=()=>
  fetch(`/key?p=240&u=${b.dataset.sb}&d=1`).catch(()=>{}));
(async()=>{
  let resp;try{resp=await fetch('/stream');}catch(e){hud.textContent='fetch failed: '+e;return;}
  const reader=resp.body.getReader();let buf=new Uint8Array(0);
  for(;;){
    const r=await reader.read();if(r.done){hud.textContent='stream ended';break;}
    const nb=new Uint8Array(buf.length+r.value.length);nb.set(buf,0);nb.set(r.value,buf.length);buf=nb;
    for(;;){
      if(buf.length<5)break;
      const type=buf[0];
      const len=((buf[1]<<24)>>>0)+(buf[2]<<16)+(buf[3]<<8)+buf[4];
      if(buf.length<5+len)break;
      const data=buf.slice(5,5+len);buf=buf.subarray(5+len);
      if(type===2){if(data.length>=1){orient=data[0];applyOrient();}continue;}
      if(type===3){started=false;if(dec){try{dec.close()}catch(e){}}dec=null;continue;}
      const key=(type===1);
      if(!started){if(!key)continue;const cs=codecFromAU(data);if(cs)codec=cs;mkdec();started=true;}
      try{
        dec.decode(new EncodedVideoChunk({type:key?'key':'delta',timestamp:ts,data}));ts+=10000;
      }catch(e){hud.textContent='decode err: '+e.message;}
    }
  }
})();
</script></body></html>

<!doctype html>
<!-- rctl web client. Served from /var/mobile/rctl/index.html on the device
     (falls back to the copy embedded in HttpStreamServer.mm). -->
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>rctl</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#ddd;
    font-family:-apple-system,system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{transform-origin:center center}
  #hud{position:fixed;top:6px;left:8px;font-size:11px;opacity:.5;z-index:10;pointer-events:none}
  /* Floating controls: a small button that opens a popover, so the screen is
     unobstructed while viewing. */
  #fab{position:fixed;right:13px;bottom:13px;z-index:20;width:42px;height:42px;
    border-radius:50%;border:0;background:rgba(22,22,24,.55);color:#f2f2f7;font-size:18px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 2px 10px rgba(0,0,0,.4);transition:background .12s}
  #fab:active,#fab.open{background:#3478f6}
  #panel{position:fixed;right:13px;bottom:62px;z-index:20;width:196px;box-sizing:border-box;
    background:rgba(28,28,31,.72);border-radius:14px;padding:8px;
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    box-shadow:0 6px 22px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:5px;
    opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .13s,transform .13s}
  #panel.open{opacity:1;transform:none;pointer-events:auto}
  .sect{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#7d7d82;margin:3px 2px -2px}
  .row{display:flex;gap:5px}
  #panel button{flex:1;min-width:0;background:#3a3a3d;color:#f2f2f7;border:0;border-radius:8px;
    padding:7px 4px;font-size:12px;white-space:nowrap}
  #panel button:active{background:#3478f6}
  #panel button.on{background:#3478f6}
  #panel .slider{flex:1;width:100%;accent-color:#3478f6;height:26px;margin:0 2px}
  /* Console (playground) modal */
  #pg{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);padding:16px;box-sizing:border-box}
  #pg.open{display:flex}
  #pgcard{width:min(600px,100%);max-height:90vh;overflow:auto;box-sizing:border-box;
    background:rgba(28,28,31,.98);border-radius:20px;padding:18px;
    -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 16px 48px rgba(0,0,0,.6)}
  .pghdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
  .pghdr h2{margin:0;font-size:18px;font-weight:600;color:#f2f2f7}
  #pgX{width:30px;height:30px;border-radius:50%;border:0;background:#3a3a3d;color:#f2f2f7;font-size:17px;line-height:1}
  #pggrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media(max-width:540px){#pggrid{grid-template-columns:1fr}}
  .pgsec{background:#242427;border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:7px}
  .pgsec.wide{grid-column:1/-1}
  .pgsec label{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#86868b}
  .pgsec input,.pgsec textarea{background:#151517;border:1px solid #3a3a3d;border-radius:8px;
    color:#f2f2f7;padding:9px 10px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box}
  .pgsec input:focus,.pgsec textarea:focus{border-color:#3478f6}
  .pgsec textarea{min-height:60px;resize:vertical}
  .pgsec #devInfo,.pgsec #recInfo{font-size:12px;color:#c7c7cc;min-height:18px;word-break:break-word}
  #recBtn.rec{background:#e0392b;color:#fff}
  .pgsec .act{display:flex;gap:7px;margin-top:auto}
  .pgsec button{flex:1;border:0;border-radius:8px;padding:9px;font-size:13px;font-weight:500;color:#fff;background:#3478f6}
  .pgsec button.sec{background:#3a3a3d}
  .pgsec .fbar{display:flex;gap:7px}
  .pgsec .fbar input{flex:1;min-width:0}
  .pgsec .fbar button{flex:0 0 auto;padding:9px 13px}
  .flist{max-height:240px;overflow:auto;background:#151517;border:1px solid #3a3a3d;border-radius:8px}
  .frow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #2a2a2d;font-size:13px}
  .frow:last-child{border-bottom:0}
  .frow .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow.dir .fn{cursor:pointer;color:#4aa3ff}
  .frow .fsz{color:#86868b;font-size:11px;white-space:nowrap}
  .frow .fb{flex:0 0 auto;width:auto;padding:4px 9px;font-size:12px;background:#3a3a3d}
  .frow .fb.del{background:#5a2b2b}
  .pgsec .fxbtns{display:flex;gap:7px;flex-wrap:wrap}
  .pgsec .fxbtns button{flex:1 1 28%;min-width:84px}
  .pgsec .fxbtns #fxSpook{flex-basis:100%;background:#7b1fa2}
</style></head>
<body>
<div id="hud">rctl: connecting…</div>
<div id="stage"><canvas id="c"></canvas></div>

<button id="fab" aria-label="controls">⚙</button>
<div id="panel">
  <div class="sect">System</div>
  <div class="row">
    <button data-b="home">⌂ Home</button>
    <button data-b="lock">⏻ Lock</button>
  </div>
  <div class="row">
    <button data-sb="1">Control&nbsp;Center</button>
    <button data-sb="2">Shade</button>
  </div>
  <div class="sect">Volume</div>
  <div class="row">
    <button data-b="voldn">Vol&nbsp;−</button>
    <button data-b="volup">Vol&nbsp;+</button>
  </div>
  <div class="sect">Brightness</div>
  <div class="row"><input id="brSlider" class="slider" type="range" min="0" max="100" value="50"></div>
  <div class="sect">Orientation</div>
  <div class="row">
    <button id="oAuto" class="on">Auto</button>
    <button id="oRot">⟳ Rotate</button>
  </div>
  <div class="sect">Tools</div>
  <div class="row"><button id="pgOpen">⌨ Console</button><button id="rspPanel">↻ Respring</button></div>
  <div class="sect">Quality</div>
  <div class="row">
    <button data-q="hq" class="on">High</button>
    <button data-q="bal">Balanced</button>
    <button data-q="lat">Low&nbsp;latency</button>
  </div>
</div>

<div id="pg"><div id="pgcard">
  <div class="pghdr"><h2>Console</h2><button id="pgX">✕</button></div>
  <div id="pggrid">
    <div class="pgsec wide"><label>FX / Pranks 👻</label>
      <input id="fxText" placeholder="text to speak / show on screen" spellcheck="false">
      <div class="fxbtns">
        <button id="fxSay" class="sec">🗣 Speak</button>
        <button id="fxCreepy" class="sec">🧟 Creepy</button>
        <button id="fxBanner" class="sec">📢 Banner</button>
        <button id="fxFlash" class="sec">⚡️ Flash</button>
        <button id="fxSound" class="sec">🔊 Sound</button>
        <button id="fxSpook">👻 SPOOK!</button>
      </div></div>
    <div class="pgsec wide"><label>Camera (silent snap from the open app)</label>
      <div class="act"><button id="camRear" class="sec">📷 Rear</button><button id="camFront" class="sec">🤳 Front</button><button id="camDl" style="display:none">⬇ Save</button></div>
      <div id="camInfo" style="font-size:12px;color:#c7c7cc;min-height:16px"></div>
      <img id="camImg" style="display:none;width:100%;border-radius:8px;margin-top:6px"></div>
    <div class="pgsec"><label>Alert</label>
      <input id="aTitle" placeholder="Title"><input id="aMsg" placeholder="Message">
      <div class="act"><button id="aBtn">Show alert</button></div></div>
    <div class="pgsec"><label>Toast</label>
      <input id="tText" placeholder="Text">
      <div class="act"><button id="tBtn">Show toast</button></div></div>
    <div class="pgsec"><label>Launch app</label>
      <input id="lBundle" list="appList" placeholder="App name or bundle id">
      <datalist id="appList"></datalist>
      <div class="act"><button id="lBtn">Launch</button></div></div>
    <div class="pgsec"><label>Type text (into focused field)</label>
      <input id="yText" placeholder="hello world">
      <div class="act"><button id="yBtn">Type</button></div></div>
    <div class="pgsec"><label>Open URL</label>
      <input id="urlIn" placeholder="https://apple.com">
      <div class="act"><button id="urlBtn">Open</button></div></div>
    <div class="pgsec"><label>Device info</label>
      <div id="devInfo">—</div>
      <div class="act"><button id="devBtn" class="sec">Refresh</button></div></div>
    <div class="pgsec"><label>Screenshot (saved in browser, invisible on iPad)</label>
      <div class="act"><button id="shotB">Save screenshot</button></div></div>
    <div class="pgsec"><label>Device</label>
      <div class="act"><button id="rspBtn" class="sec">Respring</button></div></div>
    <div class="pgsec"><label>Record &amp; play (touch + keys)</label>
      <div id="recInfo">no recording</div>
      <div class="act"><button id="recBtn" class="sec">● Record</button><button id="playBtn">▶ Play</button></div></div>
    <div class="pgsec wide"><label>Files (browser ↔ iPad)</label>
      <div class="fbar"><button id="fUp" class="sec">↑</button><input id="fPath" value="/var/mobile" spellcheck="false"><button id="fGo" class="sec">Go</button></div>
      <div id="fList" class="flist"></div>
      <input id="fUpload" type="file" style="display:none">
      <div class="act"><button id="fUpBtn" class="sec">⬆ Upload to this folder</button></div></div>
    <div class="pgsec wide"><label>Clipboard (Mac ↔ iPad)</label>
      <textarea id="clip" placeholder="clipboard text"></textarea>
      <div class="act"><button id="clGet" class="sec">Get from iPad</button><button id="clSet">Set on iPad</button></div></div>
    <div class="pgsec wide"><label>Script (JSON macro)</label>
      <textarea id="sJson" placeholder='{"actions":[{"type":"tap","x":0.5,"y":0.5}]}'></textarea>
      <div class="act"><button id="sBtn">Run</button></div></div>
  </div>
</div></div>

<script>
const hud=document.getElementById('hud'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let dec=null,ts=0,frames=0,started=false,orient=1,codec='avc1.640033';
// Manual orientation override (null = follow the device). Applies to BOTH the
// displayed rotation and the input coordinate mapping, so they stay consistent.
let manualOrient=null;
function effOrient(){ return manualOrient!=null?manualOrient:orient; }
// UIInterfaceOrientation -> CSS rotation (deg) to make content upright.
const DEG={1:0,2:180,3:-90,4:90};
function applyOrient(){
  const deg=DEG[effOrient()]||0,cw=canvas.width||1,ch=canvas.height||1;
  const r90=(deg===90||deg===-90);
  const bbW=r90?ch:cw,bbH=r90?cw:ch;
  const sc=Math.min(innerWidth/bbW,innerHeight/bbH);
  canvas.style.transform=`rotate(${deg}deg) scale(${sc})`;
}
addEventListener('resize',applyOrient);
// Derive the WebCodecs codec string from an Annex-B SPS NAL (type 7).
function codecFromAU(au){
  for(let i=0;i+8<au.length;i++){
    if(au[i]===0&&au[i+1]===0&&au[i+2]===0&&au[i+3]===1&&(au[i+4]&0x1f)===7){
      return 'avc1.'+[au[i+5],au[i+6],au[i+7]].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }
  return null;
}
function mkdec(){
  if(dec){try{dec.close()}catch(e){}}
  dec=new VideoDecoder({
    output:f=>{const rs=(canvas.width!==f.displayWidth||canvas.height!==f.displayHeight);
      if(rs){canvas.width=f.displayWidth;canvas.height=f.displayHeight;}
      ctx.drawImage(f,0,0);f.close();frames++;if(rs)applyOrient();},
    error:e=>{hud.textContent='decoder error: '+e.message;started=false;dec=null;}
  });
  dec.configure({codec,optimizeForLatency:true});
}
setInterval(()=>{hud.textContent=`rctl — ${frames}f ${canvas.width}x${canvas.height} o=${effOrient()}${manualOrient!=null?'*':''}`;},1000);

// ---- floating control panel ----
const fab=document.getElementById('fab'),panel=document.getElementById('panel');
function setPanel(open){ panel.classList.toggle('open',open); fab.classList.toggle('open',open); if(open) initBrightness(); }
fab.onclick=e=>{ e.stopPropagation(); setPanel(!panel.classList.contains('open')); };
// Brightness slider: set the device backlight, coalescing while a request is in flight.
const brSlider=document.getElementById('brSlider'); let brBusy=false, brPend=null, brInit=false;
function sendBr(v){ if(brBusy){ brPend=v; return; } brBusy=true;
  fetch(`/v1/brightness?v=${v.toFixed(3)}`).catch(()=>{}).then(()=>{ brBusy=false;
    if(brPend!=null){ const p=brPend; brPend=null; sendBr(p); } }); }
brSlider.oninput=()=>sendBr(brSlider.value/100);
async function initBrightness(){ if(brInit)return; brInit=true;
  try{ const j=await(await fetch('/v1/deviceinfo')).json();
    if(typeof j.brightness==='number') brSlider.value=Math.round(j.brightness*100); }catch(e){} }

// Quality presets
document.querySelectorAll('#panel button[data-q]').forEach(b=>b.onclick=()=>{
  const q={hq:'scale=1.0&fps=30&bitrate=24000000',
           bal:'scale=0.75&fps=45&bitrate=14000000',
           lat:'scale=0.6&fps=60&bitrate=8000000'}[b.dataset.q];
  fetch('/config?'+q);
  document.querySelectorAll('#panel button[data-q]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
});
// Orientation override: Auto follows the device; Rotate steps the view 90° CW.
const oAuto=document.getElementById('oAuto'),oRot=document.getElementById('oRot');
const ROT=[1,4,2,3]; // DEG steps 0,90,180,270
function setOrientUI(){ oAuto.classList.toggle('on',manualOrient==null); }
oAuto.onclick=()=>{ manualOrient=null; setOrientUI(); applyOrient(); };
oRot.onclick=()=>{ let i=ROT.indexOf(effOrient()); if(i<0)i=0; manualOrient=ROT[(i+1)%4]; setOrientUI(); applyOrient(); };

// ---- input: map a click on the displayed (rotated/scaled) canvas back to
// normalized framebuffer coordinates (the screen's FIXED space), send to device ----
function clientToNorm(cx,cy){
  const deg=DEG[effOrient()]||0, rad=-deg*Math.PI/180;
  const cw=canvas.width||1, ch=canvas.height||1, r90=(deg===90||deg===-90);
  const bbW=r90?ch:cw, bbH=r90?cw:ch;
  const sc=Math.min(innerWidth/bbW, innerHeight/bbH);
  let dx=(cx-innerWidth/2)/sc, dy=(cy-innerHeight/2)/sc;
  const rx=dx*Math.cos(rad)-dy*Math.sin(rad), ry=dx*Math.sin(rad)+dy*Math.cos(rad);
  return [(rx+cw/2)/cw, (ry+ch/2)/ch];
}
// Macro record/playback: capture the input we send (with timing), replay later.
let recording=null, recStart=0, macro=null;
function recPush(e){ if(recording){ e.t=performance.now()-recStart; recording.push(e); } }
function send(p,nx,ny,f){ recPush({k:'t',p,x:+nx.toFixed(4),y:+ny.toFixed(4),f});
  fetch(`/input?phase=${p}&id=${f}&x=${nx.toFixed(4)}&y=${ny.toFixed(4)}`).catch(()=>{}); }
const stage=document.getElementById('stage');
stage.style.touchAction='none';
// Multitouch: each active pointer (finger) gets its own index 0..10.
const ptrs=new Map(); // pointerId -> {finger,lastMove}
function allocFinger(){ const used=new Set(); ptrs.forEach(p=>used.add(p.finger));
  for(let i=0;i<11;i++) if(!used.has(i)) return i; return 0; }
stage.addEventListener('pointerdown',e=>{
  if(panel.classList.contains('open')){ setPanel(false); e.preventDefault(); return; } // tap-away closes panel
  const f=allocFinger(); ptrs.set(e.pointerId,{finger:f,lastMove:0});
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  const[x,y]=clientToNorm(e.clientX,e.clientY);send(0,x,y,f);e.preventDefault();});
stage.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  const now=performance.now();if(now-p.lastMove<16)return;p.lastMove=now;
  const[x,y]=clientToNorm(e.clientX,e.clientY);send(1,x,y,p.finger);e.preventDefault();});
function up(e){const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);
  const[x,y]=clientToNorm(e.clientX,e.clientY);send(2,x,y,p.finger);e.preventDefault();}
stage.addEventListener('pointerup',up);
stage.addEventListener('pointercancel',up);
// ---- keyboard: forward physical keystrokes as HID key events ----
function codeToUsage(c){
  if(/^Key[A-Z]$/.test(c)) return 0x04+(c.charCodeAt(3)-65);
  if(/^Digit[1-9]$/.test(c)) return 0x1E+(c.charCodeAt(5)-49);
  if(c==='Digit0') return 0x27;
  return ({Enter:0x28,NumpadEnter:0x28,Escape:0x29,Backspace:0x2A,Tab:0x2B,Space:0x2C,
    Minus:0x2D,Equal:0x2E,BracketLeft:0x2F,BracketRight:0x30,Backslash:0x31,
    Semicolon:0x33,Quote:0x34,Backquote:0x35,Comma:0x36,Period:0x37,Slash:0x38,CapsLock:0x39,
    ArrowRight:0x4F,ArrowLeft:0x50,ArrowDown:0x51,ArrowUp:0x52,
    Delete:0x4C,Home:0x4A,End:0x4D,PageUp:0x4B,PageDown:0x4E,
    ControlLeft:0xE0,ShiftLeft:0xE1,AltLeft:0xE2,MetaLeft:0xE3,
    ControlRight:0xE4,ShiftRight:0xE5,AltRight:0xE6,MetaRight:0xE7})[c]||0;
}
function key(u,d){ recPush({k:'k',u,d}); fetch(`/key?p=7&u=${u}&d=${d}`).catch(()=>{}); }
// Modifiers held (press/release); regular keys as one atomic tap (d=2) so a
// lost/late release can't make iOS auto-repeat ("ls -la" -> "ls -laa").
const MODS=new Set([0xE0,0xE1,0xE2,0xE3,0xE4,0xE5,0xE6,0xE7]);
// Don't forward keystrokes to the device while typing into the Console fields.
function inField(e){const t=e.target&&e.target.tagName;return t==='INPUT'||t==='TEXTAREA';}
addEventListener('keydown',e=>{if(inField(e))return;const u=codeToUsage(e.code);if(!u)return;e.preventDefault();
  if(MODS.has(u)){if(!e.repeat)key(u,1);}else{key(u,2);}});
addEventListener('keyup',e=>{if(inField(e))return;const u=codeToUsage(e.code);if(!u)return;e.preventDefault();
  if(MODS.has(u))key(u,0);});
// ---- hardware buttons (HID Consumer page 0x0C) + SpringBoard actions ----
const SYS={home:0x40,lock:0x30,volup:0xE9,voldn:0xEA};
function sysPress(name){const u=SYS[name];if(!u)return;
  fetch(`/key?p=12&u=${u}&d=1`).then(()=>setTimeout(()=>fetch(`/key?p=12&u=${u}&d=0`),70));}
document.querySelectorAll('#panel button[data-b]').forEach(b=>b.onclick=()=>sysPress(b.dataset.b));
// page 0xF0=240: 1=Control Center, 2=Cover Sheet.
document.querySelectorAll('#panel button[data-sb]').forEach(b=>b.onclick=()=>
  fetch(`/key?p=240&u=${b.dataset.sb}&d=1`).catch(()=>{}));
// ---- Console (playground): spawn alerts/toasts, launch apps, type, run macros ----
const pg=document.getElementById('pg'),$=id=>document.getElementById(id),enc=encodeURIComponent;
// Installed-app picker: load once, map display name -> bundle id for the datalist.
let appMap=null;
async function loadApps(){ if(appMap)return; appMap={};
  try{ const arr=await(await fetch('/v1/apps')).json(); const dl=$('appList'); dl.innerHTML='';
    arr.forEach(a=>{ appMap[a.name]=a.id; const o=document.createElement('option'); o.value=a.name; o.label=a.id; dl.appendChild(o); });
  }catch(e){} }
$('pgOpen').onclick=()=>{ setPanel(false); pg.classList.add('open'); loadApps(); fInit(); };
$('pgX').onclick=()=>pg.classList.remove('open');
pg.onclick=e=>{ if(e.target===pg) pg.classList.remove('open'); };

// File manager: browse the device filesystem, download/upload/delete (daemon is root).
const fPath=$('fPath'), fList=$('fList'); let fLoaded=false;
function fInit(){ if(fLoaded)return; fLoaded=true; fLoad(); }
const fSize=n=> n<1024?n+' B' : n<1048576?(n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB';
const fJoin=(d,n)=> (d.endsWith('/')?d:d+'/')+n;
const fParent=d=>{ d=d.replace(/\/+$/,''); const i=d.lastIndexOf('/'); return i<=0?'/':d.slice(0,i); };
async function fLoad(p){
  if(p!==undefined) fPath.value=p;
  const dir=fPath.value||'/';
  fList.innerHTML='<div class="frow">…</div>';
  try{
    const j=await(await fetch('/v1/ls?path='+enc(dir))).json();
    if(j.error){ fList.innerHTML='<div class="frow">'+j.error+'</div>'; return; }
    fPath.value=j.path||dir; fList.innerHTML='';
    (j.entries||[]).forEach(e=>{
      const row=document.createElement('div'); row.className='frow'+(e.dir?' dir':'');
      const nm=document.createElement('span'); nm.className='fn'; nm.textContent=(e.dir?'📁 ':'📄 ')+e.name;
      if(e.dir) nm.onclick=()=>fLoad(fJoin(j.path,e.name));
      row.appendChild(nm);
      if(!e.dir){
        const sz=document.createElement('span'); sz.className='fsz'; sz.textContent=fSize(e.size); row.appendChild(sz);
        const dl=document.createElement('button'); dl.className='fb'; dl.textContent='⬇'; dl.title='Download';
        dl.onclick=()=>fDownload(fJoin(j.path,e.name),e.name); row.appendChild(dl);
      }
      const rm=document.createElement('button'); rm.className='fb del'; rm.textContent='✕'; rm.title='Delete';
      rm.onclick=async()=>{ if(!confirm('Delete '+e.name+'?'))return;
        await fetch('/v1/rm?path='+enc(fJoin(j.path,e.name))).catch(()=>{}); fLoad(); };
      row.appendChild(rm);
      fList.appendChild(row);
    });
    if(!fList.children.length) fList.innerHTML='<div class="frow">(empty)</div>';
  }catch(err){ fList.innerHTML='<div class="frow">error</div>'; }
}
async function fDownload(path,name){
  try{ const b=await(await fetch('/v1/pull?path='+enc(path))).blob();
    const u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
  }catch(e){} }

// Camera: snap a silent photo from whatever app is in the foreground on the iPad.
let camBlob=null;
async function snap(pos){ const info=$('camInfo'); info.textContent='capturing…'; $('camDl').style.display='none';
  try{ const r=await fetch('/v1/camera?pos='+pos);
    if(!r.ok){ let m='failed'; try{ m=(await r.json()).error||m; }catch(e){} info.textContent=m; return; }
    const b=await r.blob(); camBlob=b; const img=$('camImg'); img.src=URL.createObjectURL(b); img.style.display='block'; info.textContent=''; $('camDl').style.display='';
  }catch(e){ info.textContent='error'; } }
$('camRear').onclick=()=>snap('back');
$('camFront').onclick=()=>snap('front');
$('camDl').onclick=()=>{ if(!camBlob)return; const u=URL.createObjectURL(camBlob), a=document.createElement('a');
  a.href=u; a.download='rctl-cam-'+Date.now()+'.jpg'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); };

// Browser screenshot: export the current frame upright (rotated to effOrient) —
// nothing appears on the iPad.
function shotBrowser(){
  if(!canvas.width)return;
  const deg=DEG[effOrient()]||0,cw=canvas.width,ch=canvas.height,r90=(deg===90||deg===-90);
  const t=document.createElement('canvas');t.width=r90?ch:cw;t.height=r90?cw:ch;
  const x=t.getContext('2d');x.translate(t.width/2,t.height/2);x.rotate(deg*Math.PI/180);
  x.drawImage(canvas,-cw/2,-ch/2);
  const a=document.createElement('a');a.download=`rctl-${Date.now()}.png`;a.href=t.toDataURL('image/png');a.click();
}
$('shotB').onclick=shotBrowser;

// Record / play a touch+key macro (client-side, replayed with original timing).
function updateRec(){ $('recInfo').textContent = recording ? `recording… ${recording.length}`
  : (macro && macro.length ? `recorded ${macro.length} events` : 'no recording'); }
$('recBtn').onclick=()=>{
  if(recording){ macro=recording; recording=null; $('recBtn').textContent='● Record'; $('recBtn').classList.remove('rec'); }
  else { recording=[]; recStart=performance.now(); macro=null; $('recBtn').textContent='■ Stop'; $('recBtn').classList.add('rec'); }
  updateRec();
};
$('playBtn').onclick=()=>{ if(!macro||!macro.length)return;
  macro.forEach(e=>setTimeout(()=>{ if(e.k==='t')send(e.p,e.x,e.y,e.f); else if(e.k==='k')key(e.u,e.d); }, e.t)); };
(async()=>{
  let resp;try{resp=await fetch('/stream');}catch(e){hud.textContent='fetch failed: '+e;return;}
  const reader=resp.body.getReader();let buf=new Uint8Array(0);
  for(;;){
    const r=await reader.read();if(r.done){hud.textContent='stream ended';break;}
    const nb=new Uint8Array(buf.length+r.value.length);nb.set(buf,0);nb.set(r.value,buf.length);buf=nb;
    for(;;){
      if(buf.length<5)break;
      const type=buf[0];
      const len=((buf[1]<<24)>>>0)+(buf[2]<<16)+(buf[3]<<8)+buf[4];
      if(buf.length<5+len)break;
      const data=buf.slice(5,5+len);buf=buf.subarray(5+len);
      if(type===2){if(data.length>=1){orient=data[0];applyOrient();}continue;}
      if(type===3){started=false;if(dec){try{dec.close()}catch(e){}}dec=null;continue;}
      const key=(type===1);
      if(!started){if(!key)continue;const cs=codecFromAU(data);if(cs)codec=cs;mkdec();started=true;}
      try{
        dec.decode(new EncodedVideoChunk({type:key?'key':'delta',timestamp:ts,data}));ts+=10000;
      }catch(e){hud.textContent='decode err: '+e.message;}
    }
  }
})();

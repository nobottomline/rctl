version: 2

updates:
  - package-ecosystem: gomod
    directory: /relay
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /web
      - /relay/web-admin
      - /protocol
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /relay
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

name: Feature request
description: Propose a focused product or engineering improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow or limitation, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options:
        - Device control client
        - Native device runtime
        - Camera or audio
        - Self-hosted relay
        - VPS setup and updates
        - Native mobile controller
        - Packaging or portability
        - Documentation
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and alternatives
      description: Include compatibility, security, recovery, or deployment considerations.

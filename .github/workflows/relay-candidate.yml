name: Relay deployment candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed commit on main
        required: true
        type: string

concurrency:
  group: relay-deployment-candidate
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: source
        name: Require exact main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          base="$(sed -n 's/^Version: //p' control)"
          printf '%s\n' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$base-guest.${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "tag=relay-candidate-${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: relay/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            relay/web-admin/package-lock.json
      - name: Verify protocol and browser clients
        run: |
          (cd protocol && npm ci && npm test)
          node protocol/generate.mjs --check
          (cd web && npm ci && npm test && npm run build)
          (cd relay/web-admin && npm ci && npm run lint && npm run build)
      - name: Verify relay
        working-directory: relay
        run: |
          go test -race ./...
          go vet ./...
      - name: Assemble exact candidate
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          mkdir -p candidate
          (cd relay && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X github.com/nobottomline/rctl/relay/internal/relay.Version=$VERSION" \
            -o ../candidate/rctl-relay_linux_amd64 ./cmd/rctl-relay)
          install -m 0644 web/dist/index.html candidate/control.html
          printf '%s\n' "$SOURCE_SHA" > candidate/SOURCE_COMMIT
          (cd candidate && sha256sum rctl-relay_linux_amd64 control.html SOURCE_COMMIT > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate/*
      - name: Create immutable draft deployment candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test -z "$(gh release view "$TAG" --json id --jq .id 2>/dev/null || true)"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$SOURCE_SHA"
          fi
          printf 'Reviewed relay deployment candidate from commit %s.\n\nDraft only. No stable package, update catalog, APT feed or public installer is changed. Physical device qualification remains separate.\n' "$SOURCE_SHA" > candidate-notes.md
          gh release create "$TAG" candidate/* --target "$SOURCE_SHA" --draft --prerelease \
            --title "Relay candidate $VERSION" --notes-file candidate-notes.md
